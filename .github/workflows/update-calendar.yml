name: Update calendar

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 00:30 UTC (6:00 am India time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build filtered calendar
        run: python filter_calendar.py

      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          # Weekly heartbeat so GitHub never pauses the daily schedule for inactivity
          if [ "$(date -u +%u)" = "1" ]; then
            date -u > docs/last-checked.txt
          fi
          git add -A docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update calendar"
          git pull --rebase -X theirs origin main
          git push
